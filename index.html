<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F12" media="(prefers-color-scheme: dark)">
<meta name="description" content="Training, Gewicht und Ernährung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Kompass „Cockpit“ (27.11.2026): Graphit als Grund, je Bereich eine Lichtfarbe wie Ambientebeleuchtung.
   Eisblau = Gewicht und Ziel (Standard-Akzent), Bernstein = Training, Mint = Essen. Archivo für Zahlen, Instrument Sans für Text. */
:root{
  --bg:#DCE0DE; --app:#EEF0EE; --surface:#FFFFFF; --surface-2:#EBEEED; --ink:#12161A; --ink-2:#4A545D; --ink-3:#66707A;
  --line:#DCE1DF; --accent:#1F7FC4; --accent-ink:#FFFFFF; --accent-soft:#E2EFF9; --accent-text:#16679F;
  --route:#1F7FC4; --route-soft:#E2EFF9; --route-text:#16679F;
  --drive:#C27200; --drive-ink:#FFFFFF; --drive-soft:#FBEEDB; --drive-text:#8E5300;
  --fuel:#0E8C70; --fuel-ink:#FFFFFF; --fuel-soft:#DCF2EB; --fuel-text:#0A6B55;
  --slab:#151A20; --slab-2:#232A32; --slab-ink:#EEF2F5; --slab-ink-2:#A3ADB7; --slab-accent:#7CC8FF;
  --good:#15784A; --good-soft:#DFF1E7; --warn:#B4461F; --warn-soft:#FBE6DC; --bad:#B73225; --bad-soft:#FAE3E0;
  --scrim:rgba(10,14,18,.45); --shadow:0 1px 2px rgba(18,22,26,.05),0 8px 24px rgba(18,22,26,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#050607; --app:#0C0F12; --surface:#171B20; --surface-2:#20262C; --ink:#EEF2F5; --ink-2:#A6B0BA; --ink-3:#7D8791;
  --line:#293037; --accent:#7CC8FF; --accent-ink:#06121C; --accent-soft:#132839; --accent-text:#94D3FF;
  --route:#7CC8FF; --route-soft:#132839; --route-text:#94D3FF;
  --drive:#FFB547; --drive-ink:#1A1205; --drive-soft:#30240F; --drive-text:#FFC56E;
  --fuel:#5ED3B8; --fuel-ink:#04170F; --fuel-soft:#0F2C25; --fuel-text:#7BE0C8;
  --slab:#1A2027; --slab-2:#262E37; --slab-ink:#EEF2F5; --slab-ink-2:#A6B0BA; --slab-accent:#7CC8FF;
  --good:#4FCB86; --good-soft:#11301F; --warn:#FF8A5C; --warn-soft:#3A1E12; --bad:#F06F5E; --bad-soft:#3A1915;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark}}
/* Jeder Bereich leuchtet in seiner Farbe: der Akzent wird je Bereich umgestellt */
.app[data-dom="drive"]{--accent:var(--drive);--accent-ink:var(--drive-ink);--accent-soft:var(--drive-soft);--accent-text:var(--drive-text);--slab-accent:var(--drive)}
.app[data-dom="fuel"]{--accent:var(--fuel);--accent-ink:var(--fuel-ink);--accent-soft:var(--fuel-soft);--accent-text:var(--fuel-text)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--app);display:flex;flex-direction:column;isolation:isolate;overflow:hidden}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(10,15,25,.12)}}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:16px;display:grid;gap:4px}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:32px}
.stack>*,.card>*,.meal>*,.slab>*{min-width:0}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 0}
.sec-t h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sec-t small{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .12s ease;outline:none}
.tap:active:not(:has(button:active)){transform:scale(.985)}
.tap:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.go{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);flex:none}
.slab .go{color:inherit;opacity:.7}
.coach.tap{grid-template-columns:auto 1fr auto;align-items:center}
button.chip{cursor:pointer}
.sub{font-size:14px;color:var(--ink-2)}
.link{color:var(--accent-text);font-weight:500;font-size:14px;min-height:32px;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:4px;background:var(--accent)}
.chip.wait i{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.t-good{background:var(--good-soft);color:var(--good)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-accent{background:var(--accent-soft);color:var(--accent-text)}
.t-neutral{background:var(--surface-2);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--surface-2);color:var(--ink)}
.btn-q{color:var(--ink-2)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--ink-2)}

.tabbar{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:2px;min-height:48px;padding-top:4px;color:var(--ink-3);font-size:11px;font-weight:500;letter-spacing:.02em}
.tab.on{color:var(--ink)}
.tab.on .ic{color:var(--tc,var(--accent))}
.tab-c .tab-ic{width:52px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:var(--app);margin-top:-4px}
.tab-c.on .tab-ic{background:var(--accent);color:var(--accent-ink)}
.tab-c.on .ic{color:inherit}

.slab{background:var(--slab);color:var(--slab-ink);border-radius:24px;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.slab::after{content:"";position:absolute;right:-56px;top:-56px;width:180px;height:180px;border-radius:50%;border:18px solid var(--slab-2);pointer-events:none}
.slab::before{content:"";position:absolute;right:-6px;top:-6px;width:80px;height:80px;border-radius:50%;border:2px solid var(--slab-2);pointer-events:none}
.slab>*{position:relative;z-index:1}
.slab .eyebrow{color:var(--slab-ink-2)}
.slab-title{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;margin:4px 0 0;letter-spacing:-.01em}
.slab-facts{display:flex;gap:16px;font-size:14px;color:var(--slab-ink-2)}
.slab-facts b{font-family:var(--f-display);font-size:20px;color:var(--slab-ink);font-weight:600;margin-right:4px}
.focus{list-style:none;margin:0;padding:16px 0 0;display:grid;gap:8px;border-top:1px solid var(--slab-2)}
.focus li{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px;line-height:1.45}
.focus li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:6px;background:var(--slab-ink-2)}
.focus li.f-warn::before{background:var(--warn)}
.focus li.f-good::before{background:var(--good)}
.focus li.f-accent::before{background:var(--slab-accent)}
.btn-slab{background:var(--drive);color:var(--drive-ink);min-height:52px;border-radius:16px;font-size:17px;font-weight:700}
.slab-done{display:flex;align-items:center;gap:12px;background:var(--slab-2);border-radius:14px;padding:12px 16px;font-size:14px}
.slab-done .ic{color:var(--good)}

.big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-stretch:112%;letter-spacing:-.02em}
.big small{font-family:var(--f-text);font-size:16px;font-weight:500;color:var(--ink-3);margin-left:4px}
.mid{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1}
.wrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:8px 12px;display:grid}
.kv span{font-size:12px;color:var(--ink-3)}
.kv b{font-family:var(--f-display);font-size:20px;font-weight:600}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chartbox{position:relative;margin:0 -4px}
.chart{display:block;overflow:visible;touch-action:pan-y;user-select:none}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:12px;font-family:var(--f-text)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.08}
.chart .rawdot{fill:var(--ink-3);opacity:.55}
.chart .mdot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .enddot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .xd{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .ph{fill:var(--surface-2)}
.chart .ph.cur{fill:var(--accent-soft)}
.chart .phl{fill:var(--ink-2);font-size:12px;font-weight:500;font-family:var(--f-text)}
.chart .phl.cur{fill:var(--accent-text)}
.tip{position:absolute;top:-8px;left:0;background:var(--ink);color:var(--app);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.4;pointer-events:none;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:2}
.spark{display:block;overflow:visible}

.corr{position:relative;height:40px;margin-top:4px}
.corr-track{position:absolute;left:0;right:0;top:14px;height:12px;border-radius:6px;background:var(--surface-2)}
.corr-band{position:absolute;top:14px;height:12px;background:var(--good-soft);border:1.5px solid var(--good);border-radius:4px}
.corr-mark{position:absolute;top:6px;width:4px;height:28px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.corr-lbl{position:absolute;top:30px;font-size:12px;color:var(--ink-3);transform:translateX(-50%)}
.corr-lbl.l0{transform:none}.corr-lbl.l1{transform:translateX(-100%)}

.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px;text-align:left;width:100%}
.rows>.row:first-child{border-top:0}
.row-t{font-weight:500;font-size:15px;line-height:1.3}
.row-s{font-size:13px;color:var(--ink-3);line-height:1.35}
.row-r{display:flex;align-items:center;gap:12px}
.row-v{font-family:var(--f-display);font-size:20px;font-weight:600;text-align:right;line-height:1}
.row-v small{display:block;font-family:var(--f-text);font-size:12px;font-weight:500;color:var(--ink-3);margin-top:4px}
.wk{display:grid;grid-template-columns:64px 1fr 64px 52px;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.wk:first-child{border-top:0}
.wk .k{font-weight:600}
.wk .k small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.wk .a{font-family:var(--f-display);font-size:20px;font-weight:600;text-align:right}
.wk .d{text-align:right;font-size:13px;font-weight:600}
.up{color:var(--warn)}.dn{color:var(--good)}.eq{color:var(--ink-3)}
.wk-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;height:28px;align-items:end}
.wk-dots i{display:block;border-radius:2px;background:var(--accent);opacity:.75;min-height:3px}
.wk-dots i.x{background:var(--line);opacity:1;height:3px}

.phase{display:grid;grid-template-columns:16px 1fr auto;gap:12px;padding:10px 0;align-items:start}
.phase .rail{position:relative;height:100%;display:grid;justify-items:center}
.phase .rail::before{content:"";width:10px;height:10px;border-radius:5px;border:2px solid var(--ink-3);background:var(--surface);margin-top:5px;position:relative;z-index:1}
.phase .rail::after{content:"";position:absolute;top:17px;bottom:-14px;width:2px;background:var(--line)}
.phase:last-child .rail::after{display:none}
.phase.cur .rail::before{border-color:var(--accent);background:var(--accent)}
.phase.next .rail::before{border-style:dashed}
.phase .pn{font-weight:600;font-size:15px}
.phase .pd{font-size:13px;color:var(--ink-3)}
.phase .pv{font-family:var(--f-display);font-size:20px;font-weight:600;text-align:right;line-height:1.2}
.phase .pv small{display:block;font-family:var(--f-text);font-size:12px;font-weight:500;color:var(--ink-3)}

.vol{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:72px 1fr 40px;gap:12px;align-items:center;font-size:14px}
.vbar{position:relative;height:16px;border-radius:4px;background:var(--surface-2)}
.vbar .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 6px);border-radius:0 4px 4px 0}
.vbar .fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--accent)}
.vbar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.vval{font-family:var(--f-display);font-weight:600;font-size:18px;text-align:right}
.vaxis{display:grid;grid-template-columns:72px 1fr 40px;gap:12px;font-size:12px;color:var(--ink-3)}
.vaxis div{display:flex;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--accent)}
.legend i.p{width:2px;height:12px;background:var(--ink)}
.legend i.z{background:repeating-linear-gradient(135deg,var(--ink-3) 0 2px,transparent 2px 5px);opacity:.6}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:12px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05}
.stat span{font-size:12px;color:var(--ink-3);line-height:1.3}

.pl{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--slab-2);font-size:14px;align-items:baseline}
.pl:first-child{border-top:0}
.pl .n{font-family:var(--f-display);font-weight:600;color:var(--slab-ink-2)}
.pl .v{font-family:var(--f-display);font-size:16px;color:var(--slab-ink-2);text-align:right}
.pl .v b{color:var(--slab-ink);font-weight:600}

.sess-top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:8px;background:var(--app)}
.sess-title{display:grid;justify-items:center;line-height:1.2}
.elapsed{font-family:var(--f-display);font-weight:600;font-size:20px}
.exstrip{display:flex;gap:8px;overflow-x:auto;padding-top:4px;padding-bottom:12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.exstrip::-webkit-scrollbar{display:none}
.expill{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border-radius:18px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow);max-width:180px}
.expill .k{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2)}
.expill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expill.cur{background:var(--ink);color:var(--app)}
.expill.cur .k{background:var(--accent);color:var(--accent-ink)}
.expill.done .k{background:var(--good);color:#fff}
.exhead{padding-top:20px;display:grid;gap:8px}
.exname{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.exname small{display:block;font-family:var(--f-text);font-size:14px;font-weight:400;color:var(--ink-3);margin-top:6px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink-2);box-shadow:var(--shadow)}
.tag b{font-weight:600;color:var(--ink)}
.tag.vid{text-decoration:none;color:var(--accent-text);font-weight:600}
.tag.set{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
.coach{border-radius:16px;padding:12px 16px;display:grid;gap:2px;font-size:14px;line-height:1.45}
.coach b{font-size:14px;font-weight:600}
.coach.c-accent{background:var(--accent-soft)} .coach.c-accent b{color:var(--accent-text)}
.coach.c-good{background:var(--good-soft)} .coach.c-good b{color:var(--good)}
.coach.c-warn{background:var(--warn-soft)} .coach.c-warn b{color:var(--warn)}
.coach.c-neutral{background:var(--surface-2)}
.lastline{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-3);padding:0 4px}
.lastline b{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--ink-2)}
.sets{display:grid;gap:8px}
.set{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.set-sum{display:grid;grid-template-columns:56px 1fr auto 32px;align-items:center;gap:8px;width:100%;min-height:56px;padding:0 12px 0 16px;text-align:left}
.set-n{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.set-v{font-family:var(--f-display);font-size:22px;font-weight:600}
.set-v small{font-family:var(--f-text);font-size:13px;font-weight:400;color:var(--ink-3)}
.set .chk{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line);color:transparent}
.set.done .chk{background:var(--good);border-color:var(--good);color:#fff;animation:pop .25s ease}
.set.pend .set-v{color:var(--ink-3)}
.set.act{outline:2px solid var(--accent);outline-offset:-2px}
.set-body{padding:4px 12px 16px 16px;display:grid;gap:16px}
.set-top{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 0 16px}
.set-top .g{font-size:13px;color:var(--ink-3)}
.set-top .g b{color:var(--ink-2);font-weight:600}
.ctrl{display:grid;grid-template-columns:1fr 1fr 56px;gap:8px;align-items:stretch}
.step{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:var(--surface-2);border-radius:14px;height:64px}
.step button{height:64px;display:grid;place-items:center;color:var(--ink-2);border-radius:14px}
.step button:active{background:var(--line)}
.step .sv{display:grid;justify-items:center;line-height:1}
.step .sv b{font-family:var(--f-display);font-size:30px;font-weight:700}
.step .sv small{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.donebtn{border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.gauge{display:grid;gap:6px}
.gauge-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.gauge-h b{font-weight:600;text-align:right}
.gauge-t{display:grid;gap:4px}
.gauge-t i{height:10px;border-radius:3px;background:var(--surface-2);position:relative}
.gauge-t i.on{background:var(--accent)}
.gauge-t i.gh::after{content:"";position:absolute;left:50%;top:-5px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px);border-radius:1px}
.gauge-n{display:grid;gap:4px;font-size:12px;color:var(--ink-3);text-align:center;font-family:var(--f-display);font-weight:600}
.delta{font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px}
.delta.p{background:var(--good-soft);color:var(--good)}
.delta.m{background:var(--warn-soft);color:var(--warn)}
.delta.z{background:var(--surface-2);color:var(--ink-3)}
.rir{display:grid;gap:8px;padding:0 16px 14px}
.rir p{margin:0;font-size:13px;color:var(--ink-2)}
.rir-c{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rir-c button{min-height:44px;border-radius:12px;background:var(--surface-2);font-family:var(--f-display);font-size:20px;font-weight:600}
.rir-c button small{display:block;font-family:var(--f-text);font-size:10px;font-weight:500;color:var(--ink-3);margin-top:-2px}
.exact{display:flex;gap:8px}
.exact .btn{flex:1;min-height:44px;font-size:14px}
.notebox{width:100%;min-height:72px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px;font-size:14px;color:var(--ink);resize:vertical}
.sess-foot{padding-top:8px;padding-bottom:24px;display:grid;gap:8px}

.rest{background:var(--slab);color:var(--slab-ink);padding:12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;animation:up .25s ease}
.rest-prog{height:4px;border-radius:2px;background:var(--slab-2);overflow:hidden}
.rest-prog i{display:block;height:100%;background:var(--slab-accent);transform-origin:left;transition:transform .25s linear}
.rest-row{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.rest-time{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:.95;font-stretch:112%}
.rest .eyebrow{color:var(--slab-ink-2)}
.rest-next{font-size:13px;color:var(--slab-ink-2);line-height:1.35}
.rest-next b{color:var(--slab-ink);font-weight:600;display:block}
.rest-btns{display:grid;gap:6px}
.rest-btns button{min-height:40px;padding:0 14px;border-radius:12px;background:var(--slab-2);font-size:14px;font-weight:600}
.rest-btns button.go{background:var(--slab-ink);color:var(--slab)}
.rest.over .rest-time{color:var(--slab-accent)}

.macro{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:96px 1fr 92px;gap:12px;align-items:center;font-size:14px}
.mbar,.kbar{position:relative;border-radius:5px;background:var(--surface-2);overflow:hidden}
.mbar{height:10px}.kbar{height:14px;border-radius:7px}
.mbar .pl,.kbar .pl{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft)}
.mbar .ea,.kbar .ea{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px;transition:width .3s ease}
.mval{text-align:right;font-size:13px;color:var(--ink-3)}
.mval b{font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:600}
.meal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.meal-h{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.meal-h h4{margin:0;font-size:16px;font-weight:600}
.meal-h .sub{font-size:13px}
.eat{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.meal.eaten .eat{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .25s ease}
.alts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.alts::-webkit-scrollbar{display:none}
.alts button{flex:none;height:32px;padding:0 12px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:500;color:var(--ink-2)}
.alts button.on{background:var(--ink);color:var(--app)}
.items{display:grid;gap:4px;font-size:14px}
.items div{display:flex;justify-content:space-between;gap:12px}
.items span:last-child{color:var(--ink-3);text-align:right}
.mm{display:flex;gap:12px;font-size:12px;color:var(--ink-3)}
.mm b{color:var(--ink-2);font-weight:600}
.sp{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-height:52px;width:100%;text-align:left;border-top:1px solid var(--line);padding:4px 0}
.supp .sp:first-child{border-top:0}
.sp .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;justify-self:center}
.sp.on .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sp.on .sp-t{color:var(--ink-3);text-decoration:line-through}
.sp-t{font-size:15px;font-weight:500;line-height:1.3}
.sp-s{font-size:12px;color:var(--ink-3)}
.sp-d{font-size:13px;color:var(--ink-2);text-align:right}
.water{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glasses i{width:14px;height:22px;border-radius:2px 2px 5px 5px;border:2px solid var(--accent);opacity:.35}
.glasses i.on{background:var(--accent);opacity:1}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}

.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet{position:relative;background:var(--app);border-radius:28px 28px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-b{overflow-y:auto;padding-top:16px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:16px;scrollbar-width:none}
.sheet h3{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;margin:0;letter-spacing:-.01em}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wedit{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.wedit button{height:64px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center}
.wedit label{display:flex;justify-content:center;align-items:baseline;gap:6px}
.wedit input{width:100%;max-width:160px;text-align:center;border:0;background:none;font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;padding:0}
.wedit input:focus{outline:none}
.wedit span{font-size:16px;color:var(--ink-3);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500;color:var(--ink-2)}
.chips button.on{background:var(--ink);color:var(--app);box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}
.tbl td.r{font-family:var(--f-display);font-size:17px;font-weight:600}
.res{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.res:first-child{border-top:0}
.res .t{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.res .t .ic{color:var(--warn)}
.res .s{font-size:13px;color:var(--ink-3)}
.foot{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.alt-list{display:grid;gap:8px}
.alt-list button{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:500;text-align:left}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;background:var(--ink);color:var(--app);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;animation:up .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .ic{color:var(--good)}
.toast.err .ic{color:var(--warn)}
.boot{flex:1;display:grid;place-items:center;align-content:center;gap:16px;text-align:center;padding:32px}
.boot .mark{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-stretch:115%}
.boot .mark span{color:var(--accent-text)}
.boot .bar{width:160px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.boot .bar i{display:block;width:40%;height:100%;background:var(--accent);border-radius:2px;animation:slide 1.1s ease-in-out infinite}

/* Ziel, Feier, Abweichungen, Sport (Ausbau 27.11.) */
.goalrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.goalrow .sub b{color:var(--ink);font-weight:600}
.goal{display:grid;gap:6px}
.goal-t{position:relative;height:10px;border-radius:5px;background:var(--surface-2)}
.goal-t i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);transition:width .4s ease}
.goal-t b{position:absolute;top:-4px;width:2px;height:18px;border-radius:1px;background:var(--ink);transform:translateX(-1px)}
.goal-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.countdown{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.countdown b{color:var(--ink);font-weight:600}
.countdown .ic{color:var(--accent-text)}
.miles{display:grid;gap:0}
.mile{display:grid;grid-template-columns:56px 64px 1fr;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mile:first-child{border-top:0}
.mile .md{font-weight:600}
.mile .ms{font-size:13px;color:var(--ink-3);text-align:right}
.mile.ok .ms{color:var(--good);font-weight:600}
.mile.miss .ms{color:var(--warn)}
.kv em{font-style:normal;font-size:12px;font-weight:600}
.kv b small{font-family:var(--f-text);font-size:12px;font-weight:500;color:var(--ink-3)}
.coach.feier{grid-template-columns:20px 1fr;gap:12px;align-items:start}
.coach.feier>div{display:grid;gap:2px}
.coach.feier .ic{margin-top:1px}
.coach.feier.tap{grid-template-columns:20px 1fr 18px}
.coach.feier.tap .go{align-self:center}
.coach.c-warn.feier .ic{color:var(--warn)}
.slab-btns{display:grid;gap:8px}
.btn-slab2{background:var(--slab-2);color:var(--slab-ink);min-height:44px;border-radius:14px;font-size:15px}
.sport-h{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.sport-h .ic{color:var(--accent-text);margin-top:2px}
.sport-h .sub{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .btn{padding:0 10px;font-size:14px;white-space:nowrap}
.row-i{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;min-width:0}
.row-i>.ic{color:var(--ink-3)}
.alt-list small.knee{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:600}
.autot{font-size:13px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:0 4px}
.autot .link{min-height:24px;font-size:13px}
.planok{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--good)}
.planok .link{margin-left:auto}
.chips button small{font-size:12px;color:var(--ink-3);margin-left:2px}
.chips button.on small{color:inherit;opacity:.7}
.xl{display:grid}
.xi{display:grid;grid-template-columns:18px 1fr auto 44px;gap:12px;align-items:center;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.xi:first-child{border-top:0}
.xi .ic{color:var(--warn)}
.xi b{font-family:var(--f-display);font-size:18px;font-weight:600}
.xi .iconbtn{width:44px;height:44px}
.kbar{overflow:visible}
.kbar .xk{position:absolute;top:0;bottom:0;background:var(--warn);border-radius:0 7px 7px 0}
.kbar .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink);transform:translateX(-1px)}
.sub.over{font-size:13px;color:var(--warn)}
.fld{display:grid;gap:6px;font-size:13px;color:var(--ink-3)}
.fld input{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink)}
.umf{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.umf span{flex:none;display:grid;gap:2px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:12px;color:var(--ink-3)}
.umf b{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--ink)}
.wk-dots i.fe{background:var(--warn);opacity:.85}
.wk-dots i.x.fe{background:var(--warn);opacity:.5}
.chart .planl{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4;opacity:.8}
.chart .pmile{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.chart .pgoal{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .fe{fill:var(--warn)}
.chart .ub{fill:var(--accent-soft);opacity:.7}
.legend i.dash{width:14px;height:0;border-top:2px dashed var(--ink-2);background:none;border-radius:0}

/* ===== Cockpit (27.11.) ===== */
.cock-hdr{padding-bottom:4px}
.hdr-act{display:flex;align-items:center;gap:2px;margin:-10px -10px -10px 0}
.agent{display:grid;gap:12px}
.agent-say{margin:0;font-size:18px;line-height:1.4;font-weight:500;text-wrap:pretty;letter-spacing:-.005em}
.lamps{display:flex;gap:8px;flex-wrap:wrap}
.lamp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:17px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:var(--shadow);color:var(--ink-2);cursor:pointer;outline:none}
.lamp:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.lamp.ok{color:var(--good)}
.lamp.open{color:var(--ink)}.lamp.open .ic{color:var(--warn)}
.lamp.half .ic{color:var(--fuel)}
.lamp.off{opacity:.55}
.hero{background:var(--surface);border-radius:26px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.hero-l{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero-r{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);letter-spacing:.02em;text-transform:none;font-size:13px;font-weight:600}
.hero .go{color:var(--ink-3)}
.hero-t{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.01em}
.say{margin:0;font-size:15px;color:var(--ink-2);line-height:1.45}.say b{color:var(--ink);font-weight:600}
.gwrap{position:relative}.gauge-svg{display:block;width:100%;height:auto}
.gin{position:absolute;left:0;right:0;bottom:34px;display:grid;justify-items:center;gap:8px}
.gin .big{font-size:50px}
.hero-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn-drive{background:var(--drive);color:var(--drive-ink);font-weight:700}
.btn-fuel{background:var(--fuel);color:var(--fuel-ink);font-weight:700}
.hero-food{display:flex;gap:16px;align-items:center}
.ring{display:block;flex:none}
.donechip{display:inline-flex;gap:8px;align-items:center;color:var(--good);font-weight:600}
.supp1{display:flex;gap:8px;align-items:flex-start}.supp1 b{color:var(--ink);font-weight:600}
.focusnav{display:flex;justify-content:center;gap:4px;margin-top:-6px}
.focusnav button{height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;color:var(--ink-3)}
.focusnav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px;display:grid;gap:6px;align-content:start;text-align:left;box-shadow:var(--shadow);min-height:132px;transition:transform .14s ease;min-width:0}
.tile:active{transform:scale(.97)}
.tile-l{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tile-l em{font-style:normal;letter-spacing:0;font-size:12px}
.tile-v{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-stretch:110%}
.tile-v small{font-family:var(--f-text);font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px;font-stretch:100%}
.tile-s{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.tile-g{display:block;margin-top:auto}.tile-g .spark{width:100%;height:auto}
.tile-row{display:flex;gap:10px;align-items:center}
.tdots{display:flex;gap:5px}.tdots i{width:24px;height:6px;border-radius:3px;background:var(--surface-2)}.tdots i.on{background:var(--drive)}
.tile-coach{background:var(--slab);color:var(--slab-ink)}.tile-coach .tile-l,.tile-coach .tile-s{color:var(--slab-ink-2)}.tile-ic{color:var(--route)}
.hints{display:grid;gap:8px}
.hint{display:grid;grid-template-columns:18px 1fr 16px;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.4;background:var(--surface)}
.hint b{font-weight:600}
.hint>.ic:first-child{color:var(--ink-3)}.hint>.ic:last-child{color:var(--ink-3)}
.hint.h-warn{background:var(--warn-soft)}.hint.h-warn>.ic:first-child{color:var(--warn)}
.hint.h-accent{background:var(--accent-soft)}.hint.h-accent>.ic:first-child{color:var(--accent-text)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;color:var(--ink-2);font-weight:600;font-size:14px;margin-left:-6px;justify-self:start}
.coachcard .eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--accent-text)}
.linkcard{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
.linkcard>span{display:flex;gap:12px;align-items:center}.linkcard>span>.ic{color:var(--accent-text)}

<script>
/* ============ Datum und Format ============ */
const DAY=864e5;
const dt=s=>{const[a,b,c]=s.split('-').map(Number);return Date.UTC(a,b-1,c)};
const iso=t=>new Date(t).toISOString().slice(0,10);
const addD=(s,n)=>iso(dt(s)+n*DAY);
const diffD=(a,b)=>Math.round((dt(b)-dt(a))/DAY);
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MOL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MOS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const dO=s=>new Date(dt(s));
const dm=s=>{const x=dO(s);return String(x.getUTCDate()).padStart(2,'0')+'.'+String(x.getUTCMonth()+1).padStart(2,'0')+'.'};
const dlong=s=>{const x=dO(s);return WDL[x.getUTCDay()]+', '+x.getUTCDate()+'. '+MOL[x.getUTCMonth()]};
const wd=s=>WDS[dO(s).getUTCDay()];
const nf=(v,d=1)=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const kg=v=>nf(v,Number.isInteger(Math.round(v*100)/100)?0:1);
const sgn=(v,d=1)=>(v>0.0001?'+':v<-0.0001?'−':'±')+nf(Math.abs(v),d);
const nfm=(v,d=1)=>(v<-0.0001?'−':'')+nf(Math.abs(v),d);
const sum=a=>a.reduce((x,y)=>x+y,0);
const avg=a=>a.length?sum(a)/a.length:null;
const monday=s=>addD(s,-((dO(s).getUTCDay()+6)%7));
function isoWeek(s){const x=dO(s);const day=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-day+3);const fy=new Date(Date.UTC(x.getUTCFullYear(),0,4));return 1+Math.round(((x-fy)/DAY-3+((fy.getUTCDay()+6)%7))/7)}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function applyPlan(rows){
  if(!Array.isArray(rows)||!rows.length)return;
  const ex={},a=[],b=[],alts={};
  for(const r of rows){if(!r.id||!r.n)continue;
    ex[r.id]={n:r.n,d:r.d||undefined,m:MUSCLES.includes(r.m)?r.m:'Beine',r:r.r,s:r.s,inc:r.inc,rest:r.rest,set:r.set||undefined,u:r.u||'',knee:/^knie/i.test(r.d||'')};

}

function ingest(st){
  S.state=st;const lt=localToday();TODAY=st.today>lt?st.today:lt;
  applyPlan(st.plan);
  PHR=st.phases||[];
  PHASES=PHR.map(p=>({n:p.name,s:p.start,e:p.end,tab:p.tab,rate:p.rate,ziel:p.ziel,raw:p}));
  KGM=Coach.kgMap(st.weights);EVENTS=st.events||[];UMF=(st.umfang||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1);DAYS=st.days||[];
  // Gewicht
  const byDate={};for(const w of st.weights)byDate[w[0]]={v:w[1],fat:w[2],mus:w[3],src:w[4],tags:w[5]?String(w[5]).split(/\s*,\s*/).filter(Boolean):[]};
  const dates=Object.keys(byDate).sort();WT=[];
  if(dates.length){let d=dates[0];const end=TODAY>dates[dates.length-1]?TODAY:dates[dates.length-1];let t=null;
    while(d<=end){const e=byDate[d];if(e)t=t==null?e.v:t+0.1*(e.v-t);WT.push({d,v:e?e.v:null,fat:e?e.fat:null,mus:e?e.mus:null,src:e?e.src:'',tags:e?e.tags:[],t});d=addD(d,1)}}
  // Training
  const bySes={};for(const x of st.sets)(bySes[x[0]]=bySes[x[0]]||[]).push(x);
  const isAct=s=>/^[FL]/.test(String(s.plan));
  HA={};
  SESS=st.sessions.filter(s=>!isAct(s)).map(s=>{const ex={};for(const x of (bySes[s.id]||[]).sort((a,b)=>a[3]-b[3])){if(String(x[1]).startsWith('alt:')){const n=String(x[1]).slice(4);const l=HA[n]=HA[n]||[];let e=l.find(q=>q.id===s.id);if(!e)l.push(e={id:s.id,d:s.d,w:x[4],reps:[]});e.reps.push(x[5]);continue}(ex[x[1]]=ex[x[1]]||{w:x[4],reps:[]}).reps.push(x[5])}return{id:s.id,d:s.d,type:s.plan.replace(/[^AB]/g,'')||'A',min:s.min,ex,deload:/-E$/.test(String(s.plan))}}).filter(s=>Object.keys(s.ex).length||s.min).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  ACT=st.sessions.filter(isAct).map(s=>({id:s.id,d:s.d,type:s.plan[0],min:s.min,note:s.note,knie:s.knie||'',km:s.km})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  for(const l of Object.values(HA))l.sort((a,b)=>a.d<b.d?-1:1);
  H={};for(const s of SESS)for(const[id,e]of Object.entries(s.ex))(H[id]=H[id]||[]).push({d:s.d,type:s.type,w:e.w,reps:e.reps});
  // Tag
  const local=LS.get('day',null);
  S.day=local&&local.date===TODAY&&local.dirty?local:Object.assign({date:TODAY,type:'',meals:{},supps:{},water:0,extras:[],fixed:false,check:{}},st.today===TODAY&&st.day||{},{date:TODAY});
  if(!Array.isArray(S.day.extras))S.day.extras=[];
  if(!S.day.check||typeof S.day.check!=='object')S.day.check={};
  if(!S.day.fixed||!S.day.type)S.day.type=autoType().t;
}

async function api(fn,...args){
  const c=LS.get('conf',null);if(!c)throw new Error('Noch nicht verbunden');
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);
  try{
    const r=await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:c.k,fn,args}),signal:ac.signal});
    let j=null;try{j=await r.json()}catch(e){}
    if(!j)throw new Error(r.ok?'Das Script antwortet nicht wie erwartet. Steht der Zugriff der Bereitstellung auf „Jeder“?':'Das Script antwortet mit Fehler '+r.status);
    if(!j.ok){const err=new Error(j.e||'Fehler im Script');if(/Schlüssel/.test(j.e||''))err.auth=true;throw err}
    return j.r;
  }catch(e){if(e.name==='AbortError')throw new Error('Keine Antwort nach 45 Sekunden');if(e instanceof TypeError)throw new Error('Keine Verbindung');throw e}
  finally{clearTimeout(to)}
}

async function flush(){
  if(S.syncing||!S.queue.length)return;S.syncing=true;updateSyncChip();
  try{while(S.queue.length){const q=S.queue[0];
      try{await api(q.fn,...q.args)}
      catch(e){if(!/Unbekannte Funktion|nicht plausibel|Format/.test(e.message||''))throw e;
        // Dauerhafte Fehler würden die Warteschlange sonst für immer blockieren: beiseitelegen und weiter
        const dead=LS.get('dead',[]);dead.push(Object.assign({err:String(e.message),at:new Date().toISOString()},q));LS.set('dead',dead.slice(-50))}
      S.queue.shift();LS.set('queue',S.queue);if(q.fn==='saveDay'){const d=LS.get('day',null);if(d&&d.date===q.args[0]){d.dirty=false;LS.set('day',d)}if(S.state&&S.state.today===q.args[0]){S.state.day=JSON.parse(q.args[1]);LS.set('state',S.state)}}}}
  catch(e){setTimeout(flush,20000)}
  finally{S.syncing=false;updateSyncChip()}
}

/* ============ Trainer-Logik ============ */
function hintFor(id){
  const ex=EX[id],h=H[id]||[];
  if(!h.length)return{tone:'neutral',kind:'new',title:'Noch keine Werte',text:`Wähle ein Gewicht, mit dem du ${ex.r[0]} bis ${ex.r[1]} saubere Wdh. schaffst. Ab dann rechnet die App mit.`};
  const L=h[h.length-1];const gap=diffD(L.d,TODAY);
  if(gap>28)return{tone:'warn',kind:'gap',title:`${gap} Tage nicht geloggt`,text:`Zuletzt am ${dm(L.d)} mit ${kg(L.w)} kg × ${L.reps.join(' · ')}. Starte mit dem gleichen Gewicht und lass 2 Wdh. im Tank.`,w:L.w};
  const full=L.reps.length>=ex.s&&L.reps.every(r=>r>=ex.r[1]);
  if(full){const nw=Math.round((L.w+ex.inc)*10)/10;return{tone:'good',kind:'up',title:'Gewicht erhöhen',text:`Letztes Mal alle Sätze mit ${ex.r[1]} Wdh. Heute ${kg(nw)} kg und wieder bei ${ex.r[0]} anfangen.`,short:`${ex.n}: hoch auf ${kg(nw)} kg`,w:nw,up:true}}
  const recent=h.slice(-6,-1).map(x=>x.w);const rmax=recent.length?Math.max(...recent):L.w;
  if(rmax>L.w)return{tone:'accent',kind:'back',title:`Zurück auf ${kg(rmax)} kg?`,text:`Letztes Mal ${kg(L.w)} kg statt ${kg(rmax)} kg (${L.reps.join(' · ')}). Fühlt es sich heute gut an, nimm wieder ${kg(rmax)} kg.`,short:`${ex.n}: zurück auf ${kg(rmax)} kg`,w:rmax};
  let k=h.length-1;while(k>0&&h[k-1].w===L.w)k--;
  const n=h.length-k,F=h[k],sF=sum(F.reps),sL=sum(L.reps);
  if(n>=4){
    if(sL>sF)return{tone:'accent',kind:'streak',title:`${n}. Einheit mit ${kg(L.w)} kg`,text:`Seit ${dm(F.d)} von ${sF} auf ${sL} Wdh. gesamt. Das ist Fortschritt, auch ohne mehr Gewicht. Hoch geht es, wenn alle ${ex.s} Sätze bei ${ex.r[1]} sind.`,short:`${ex.n}: ${n}. Einheit mit ${kg(L.w)} kg, die Wdh. steigen (${sF} auf ${sL})`,w:L.w};
    return{tone:'warn',kind:'plateau',title:'Plateau',text:`${n} Einheiten mit ${kg(L.w)} kg ohne mehr Wdh. Vorschlag: 10 % leichter und dich drei Wochen lang sauber hocharbeiten.`,short:`${ex.n}: Plateau bei ${kg(L.w)} kg`,w:L.w};
  }
  return{tone:'neutral',kind:'aim',title:'Ziel heute',text:`Letztes Mal ${sL} Wdh. gesamt mit ${kg(L.w)} kg. Eine Wdh. mehr reicht schon.`,w:L.w};
}
function focusFor(type){
  const out=[];const last=lastSess();
  if(last){let lower=0,tot=0;for(const[id,e]of Object.entries(last.ex)){const h=H[id];const i=h.findIndex(x=>x.d===last.d&&x.type===last.type);if(i>0){tot++;if(e.w<h[i-1].w)lower++}}
    if(tot&&lower/tot>=0.5)out.push({t:'accent',x:`Am ${dm(last.d)} hattest du bei ${lower} von ${tot} Übungen weniger Gewicht drauf. Heute wieder die gewohnten Gewichte.`})}
  const gaps={};for(const id of PLAN[type].ex){const h=H[id];if(!h||!h.length)continue;const L=h[h.length-1];if(diffD(L.d,TODAY)>28){const m=EX[id].m;if(!gaps[m]||L.d>gaps[m])gaps[m]=L.d}}
  const g=Object.entries(gaps);
  if(g.length)out.push({t:'warn',x:`${g.map(([m,d])=>`${m} (zuletzt ${dm(d)})`).join(' und ')} länger nicht geloggt. Mit 2 Wdh. Reserve einsteigen.`});
  for(const id of PLAN[type].ex){const hn=hintFor(id);if(hn.kind==='up')out.push({t:'good',x:hn.short})}
  const st=PLAN[type].ex.map(hintFor).find(h=>h.kind==='streak');if(st)out.push({t:'neutral',x:st.short});
  return out.slice(0,3);
}
function trendStatus(id){
  const h=H[id];if(!h||h.length<4)return{k:'t-neutral',l:'Zu wenig Daten',ch:null};
  if(diffD(h[h.length-1].d,TODAY)>28)return{k:'t-neutral',l:'Pause',ch:null};
  const e=h.map(x=>e1(x.w,x.reps));const a=avg(e.slice(-3)),b=avg(e.slice(-6,-3));const ch=(a-b)/b;
  if(ch>0.015)return{k:'t-good',l:'Steigt',ch};if(ch<-0.015)return{k:'t-warn',l:'Sinkt',ch};return{k:'t-neutral',l:'Hält',ch};
}

/* ============ Bausteine ============ */
function sparkSVG(vals,w=96,h=32,col){
  const v=vals.filter(x=>x!=null);if(v.length<2)return'';
  let lo=Math.min(...v),hi=Math.max(...v);if(hi-lo<0.5){lo-=0.25;hi+=0.25}
  const X=i=>2+i/(vals.length-1)*(w-6),Y=y=>3+(hi-y)/(hi-lo)*(h-6);
  let d='';vals.forEach((y,i)=>{if(y==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)});
  let li=vals.length-1;while(li>0&&vals[li]==null)li--;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col||'var(--accent)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="3.5" fill="${col||'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function trackPill(t){if(!t||t.delta==null)return'';const d=t.delta;
  if(Math.abs(d)<0.25)return `<span class="pill t-good">${ic('check',14,3)}Im Plan</span>`;
  return d<0?`<span class="pill t-good">${nf(-d)} kg vor dem Plan</span>`:`<span class="pill t-warn">${nf(d)} kg hinter dem Plan</span>`}
/** Fortschrittsbalken vom Start der Phase zum Ziel: gefüllt bis zum Wochentief, Strich beim Plan von heute. */
function goalBar(t){
  const s=t.path.pts[0][1],z=t.path.kg,span=s-z||1,cl=v=>Math.max(0,Math.min(100,v));
  const done=t.low?cl((s-t.low.kg)/span*100):0,plan=cl((s-t.plan)/span*100);
  return `<div class="goal" role="img" aria-label="Von ${nf(s)} auf ${nf(z)} kg, ${nf(done,0)} Prozent geschafft">
    <div class="goal-t"><i style="width:${done}%"></i><b style="left:${plan}%"></b></div>
    <div class="goal-l"><span>${nf(s)} kg</span><span>${nf(z)} kg</span></div></div>`}
function weekCard(w,title,tap){
  const kw=isoWeek(w.von);const sp=[];if(w.fussball)sp.push(w.fussball+' × Fußball');if(w.laufen)sp.push(w.laufen+' × Laufen');
  const lines=[];
  if(w.delta!=null)lines.push(`Wochentief ${nf(w.tief)} kg, Plan ${nf(w.plan)} kg: ${Math.abs(w.delta)<0.25?'genau im Plan':w.delta<0?nf(-w.delta)+' kg vorn':nf(w.delta)+' kg hinten'}.`);
  if(sp.length)lines.push('Dazu '+sp.join(' und ')+'.');
  if(w.extraKcal)lines.push(`Extras zusammen ${nf(w.extraKcal,0)} kcal${w.feiern.length?', Feier: '+w.feiern.join(', '):''}.`);
  else if(w.feiern.length)lines.push('Feier: '+w.feiern.join(', ')+'.');
  if(w.bauch)lines.push(`Bauchumfang ${nf(w.bauch.cm)} cm${w.bauch.delta!=null?' ('+sgn(w.bauch.delta)+')':''}.`);
  return `<article class="card${tap?' tap':''}"${tap?tapTo('fortschritt','Fortschritt öffnen'):''}>
    <div class="card-h"><span class="eyebrow">${esc(title||'Wochenrückblick')} · KW ${kw}</span><span class="go"><span class="sub" style="font-size:13px">${dm(w.von)} bis ${dm(w.bis)}</span>${tap?ic('right',18):''}</span></div>
    <div class="kv"><div><span>Schnitt</span><b>${w.schnitt!=null?nf(w.schnitt):'?'}</b>${w.schnitt!=null&&w.vorwoche!=null?`<em class="${w.schnitt-w.vorwoche<-0.05?'dn':w.schnitt-w.vorwoche>0.05?'up':'eq'}">${sgn(w.schnitt-w.vorwoche)}</em>`:''}</div>
      <div><span>Kraft</span><b>${w.kraft}<small> von 2</small></b></div><div><span>Essen</span><b>${w.essenTage}<small> von 7</small></b></div></div>
    ${lines.length?`<p class="sub" style="margin:0">${esc(lines.join(' '))}</p>`:''}
    <div class="coach c-accent"><b>Für diese Woche</b><span>${esc(w.tipp)}</span></div>
  </article>`}
/** kcal-Balken: Skala reicht bis zum Größeren aus Ziel und Gegessenem, das Ziel ist ein Strich, Extras kommen orange obendrauf. */
function kcalBar(ft,tg){const T=tg[0]||1,M=Math.max(T,ft.tot,ft.pl[0])*1.02,pc=v=>Math.max(0,Math.min(100,v/M*100));
  const over=ft.tot-T;
  return `<div class="kbar" role="img" aria-label="${nf(ft.tot,0)} von ${nf(T,0)} kcal"><i class="pl" style="width:${pc(ft.pl[0])}%"></i><i class="ea" style="width:${pc(ft.ea[0])}%"></i>${ft.xk?`<i class="xk" style="left:${pc(ft.ea[0])}%;width:${pc(ft.xk)}%"></i>`:''}<b class="tgt" style="left:${pc(T)}%"></b></div>
  ${over>50?`<div class="sub over">${nf(over,0)} kcal über dem Ziel${ft.xk?', davon '+nf(Math.min(ft.xk,over),0)+' aus Extras':''}. Kein Grund zum Ausgleichen, morgen normal weiter.</div>`:''}`}

const GH=()=>(S.state&&S.state.gesundheit)||[];
const ghAt=d=>GH().find(x=>x.d===d);
const hmin=m=>{const r=Math.round(m);return Math.floor(r/60)+':'+String(r%60).padStart(2,'0')};
function rhrBase(){const a=GH().filter(x=>x.d<TODAY&&x.rhr).slice(-14).map(x=>x.rhr).sort((p,q)=>p-q);return a.length>=5?a[Math.floor(a.length/2)]:null}
/** Schlaf-Stufe für den Erholungs-Check: ab 7 Stunden gut, ab 6 okay, viel Wachzeit zieht eine Stufe ab. */
function schlafStufe(g){if(!g||!g.schlaf)return null;let v=g.schlaf>=420?2:g.schlaf>=360?1:0;if((g.wach||0)>=45&&v>0)v--;return v}
function schlafCard(){const g=GH().filter(x=>x.schlaf).slice(-7).reverse();if(!g.length)return '';
  const mx=Math.max(540,...g.map(x=>x.schlaf));
  return `<div class="sec-t"><h3>Schlaf und Puls</h3><small>Samsung Health</small></div><article class="card"><div class="slp">${g.map(x=>{const seg=(v,o)=>v>0?`<i style="width:${v/mx*100}%;opacity:${o}"></i>`:'';
    const rest=x.tief!=null?Math.max(0,x.schlaf-(x.tief||0)-(x.rem||0)):x.schlaf;
    return `<div class="slrow"><span>${dm(x.d)}</span><span class="slbar" aria-label="${hmin(x.schlaf)} Stunden Schlaf">${seg(x.tief,1)}${seg(x.rem,.6)}${seg(rest,.3)}</span><b>${hmin(x.schlaf)}</b><small>${x.rhr?x.rhr+' bpm':x.nacht?x.nacht+' bpm':''}</small></div>`}).join('')}</div>
    <p class="sub" style="margin:0;font-size:13px">Dunkel Tiefschlaf, mittel REM, hell leichter Schlaf. Rechts der Ruhepuls${GH().some(x=>x.rhr)?'':' (aus dem Nachtpuls)'}.</p></article>`}
const CHECKQ=[['schlaf','Schlaf',['schlecht','okay','gut']],['kater','Muskelkater',['stark','etwas','keiner']],['energie','Energie',['wenig','mittel','viel']]];
/** Erholung aus dem Morgen-Check: 0 bis 6 Punkte, erst wenn alle drei beantwortet sind */
function readiness(c){c=c||{};if(!CHECKQ.every(([k])=>c[k]!=null))return null;const sc=CHECKQ.reduce((a,[k])=>a+(+c[k]||0),0);return{sc,level:sc<=2?'schwach':sc<=4?'mittel':'gut'}}
const WP=mon=>{const w=(S.state&&S.state.wochenplan)||{};return Array.isArray(w[mon])?w[mon]:null};
const wpTarget=()=>dO(TODAY).getUTCDay()===0?addD(monday(TODAY),7):monday(TODAY);
/** Vorschlag für die Trainingstage: wie letzte Woche, sonst Montag und Donnerstag, nie an Fußballtagen */
function wpSuggest(mon){const prev=WP(addD(mon,-7));let wd=prev?prev.map(d=>diffD(addD(mon,-7),d)):null;
  if(!wd){const l=SESS.filter(x=>x.d>=addD(mon,-14)&&x.d<mon).map(x=>(dO(x.d).getUTCDay()+6)%7);wd=l.length>=2?[...new Set(l)].slice(-2):[0,3]}
  return wd.map(i=>addD(mon,i)).filter(d=>!Coach.eventsOn(EVENTS,d,'fussball').length).slice(0,3)}
function deloadInfo(){
  const a=LS.get('deload',null);if(a&&a.start<=TODAY&&TODAY<addD(a.start,7))return{active:true,until:addD(a.start,6)};
  // Seit wann am Stück trainiert wird: letzte Entlastung oder letzte Pause von mindestens einer Woche
  let base=SESS[0]?SESS[0].d:TODAY;for(let i=1;i<SESS.length;i++)if(diffD(SESS[i-1].d,SESS[i].d)>=8||SESS[i].deload)base=SESS[i].d;
  if(SESS.length&&diffD(SESS[SESS.length-1].d,TODAY)>=8)base=TODAY;
  const weeks=Math.floor(diffD(base,TODAY)/7),recent=SESS.filter(x=>x.d>=addD(TODAY,-42)).length;
  const plateaus=[...new Set(PLAN.A.ex.concat(PLAN.B.ex))].filter(id=>EX[id]&&(hintFor(id).kind==='plateau'||trendStatus(id).l==='Sinkt')).length;
  const low=[...Array(7)].map((_,i)=>addD(TODAY,-i)).filter(d=>{const c=d===TODAY?S.day.check:(DAYS.find(x=>x.date===d)||{}).check;const r=readiness(c);return r&&r.level==='schwach'}).length;
  // Stagnation zählt nur bei regelmäßigem Training: wer selten trainiert, braucht mehr Training, keine Pause
  const regular=SESS.filter(x=>x.d>=addD(TODAY,-28)).length>=6;
  const why=weeks>=8&&recent>=8?`${weeks} Wochen am Stück ohne Entlastung`:plateaus>=3&&regular?`${plateaus} Übungen kommen trotz regelmäßigem Training nicht weiter`:low>=3?`${low} Tage mit schwacher Erholung in einer Woche`:null;
  const skip=LS.get('deload-skip',null),quiet=skip&&TODAY<addD(skip,14);
  return{active:false,why:quiet?null:why,whyAll:why,weeks,plateaus,low}}

/* ============ Fortschrittsfotos: nur auf diesem Handy (IndexedDB), nie im Sheet ============ */
let FOTOS=null;
const FDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('kompass-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode),st=t.objectStore('f'),q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('readonly',st=>st.getAll())},put(x){return this.tx('readwrite',st=>st.put(x))},del(id){return this.tx('readwrite',st=>st.delete(id))}};
async function loadFotos(){try{const l=(await FDB.all())||[];if(FOTOS)FOTOS.forEach(f=>URL.revokeObjectURL(f.url));FOTOS=l.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id<b.id?-1:1).map(f=>({id:f.id,d:f.d,url:URL.createObjectURL(f.b)}));
  LS.set('foto-last',FOTOS.length?FOTOS[FOTOS.length-1].d:null)}catch(e){FOTOS=[]}}
async function shrinkFoto(file){
  let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82))}
/** Alle zwei Wochen ein Foto und ein Tagebuch-Eintrag. Fällig, wenn beides länger als 13 Tage her ist. */
const TB=()=>(S.state&&S.state.tagebuch)||[];
const fotoSeit=()=>{const l=[LS.get('foto-last',null)].concat(TB().map(x=>x.d)).filter(Boolean).sort().pop();return l?diffD(l,TODAY):null};
function fotoDue(){const g=fotoSeit();return g==null||g>=14}
/** Rückblick auf die zwei Wochen bis zu einem Tag, als kurzer Text fürs Tagebuch */
function zweiWochen(end){
  const from=addD(end,-13),mid=addD(end,-7),inR=d=>d>=from&&d<=end;
  const a=avg(WT.filter(p=>p.d>=from&&p.d<=mid&&p.v!=null).map(p=>p.v)),b=avg(WT.filter(p=>p.d>mid&&p.d<=end&&p.v!=null).map(p=>p.v));
  const kraft=SESS.filter(x=>inR(x.d)).length,fb=ACT.filter(x=>inR(x.d)&&x.type==='F').length,lauf=ACT.filter(x=>inR(x.d)&&x.type==='L').length;
  const ds=DAYS.filter(x=>inR(x.date)),essen=ds.filter(x=>x.n>0).length,extra=sum(ds.map(x=>+x.kcalExtra||0));
  const feiern=new Set();for(const e of EVENTS)if(e.art==='feier'&&e.s>=from&&e.s<=end)feiern.add(dm(e.s)+' '+e.t);for(const x of ds)if(x.feier)feiern.add(dm(x.date));
  const schwach=[...Array(14)].map((_,i)=>addD(end,-i)).filter(d=>{const c=d===TODAY?S.day.check:(DAYS.find(x=>x.date===d)||{}).check;const r=readiness(c);return r&&r.level==='schwach'}).length;
  const out=[];
  if(a!=null&&b!=null)out.push(`Gewicht: Schnitt ${nf(a)} auf ${nf(b)} kg (${Math.abs(b-a)<0.05?'±0,0':sgn(b-a)}).`);else if(b!=null)out.push(`Gewicht: Schnitt ${nf(b)} kg.`);
  out.push(`Training: ${kraft} Kraft${fb?', '+fb+' Fußball':''}${lauf?', '+lauf+' Laufen':''}.`);
  out.push(`Essen an ${essen} von 14 Tagen eingetragen${extra?', Abweichungen '+nf(extra,0)+' kcal':''}.`);
  if(feiern.size)out.push('Feiern: '+[...feiern].slice(0,4).join(', ')+'.');
  if(schwach)out.push(`${schwach} ${schwach===1?'Tag':'Tage'} mit schwacher Erholung.`);
  return out.join(' ');
}

 training:['Trainer',[['besetzt','Gerät ist besetzt'],['voll','Studio ist sehr voll'],['technik','Wie geht die Übung?'],['schwer','Gewicht ist zu schwer'],['leicht','Gewicht ist zu leicht'],['zwickt','Es zwickt oder schmerzt'],['zeit','Ich habe wenig Zeit'],['pause','Wie lange Pause?'],['deload','Brauche ich eine Pause?'],['woche','Woche planen']]],

/** Antwort des Coaches, mit den aktuellen Zahlen und einer passenden Aktion */
function coachAnswer(q){
  const inS=!!(S.session&&S.inSession),E=inS?curEx():null,ex=E?exOf(E):null,nt=nextType();
  const ai=E?(()=>{const i=E.act!=null&&E.sets[E.act]&&!E.sets[E.act].done?E.act:E.sets.findIndex(x=>!x.done);return i<0?0:i})():0;
  const plan=curPlan(),tg=dayTargets(plan),ft=plan?foodTotals(plan):null,t=trackNow(),ri=rateInfo();
  switch(q){
  case 'besetzt':return{t:'Gerät ist besetzt',p:['Frag kurz, wie viele Sätze noch fehlen. Meist ist es in zwei, drei Minuten frei.','Sonst tausch auf eine Alternative mit den gleichen Muskeln oder schieb die Übung ans Ende. Jede Alternative bekommt ihren eigenen Verlauf, deine Zahlen bleiben vergleichbar.'],
    a:inS?[cBtn(ic('swap',18)+'Alternativen zeigen','data-do="swap"',true),cBtn('Ans Ende schieben','data-do="later"')]:[cBtn(ic('play',18)+'Training starten',`data-do="start" data-t="${nt}"`,true)]};
  case 'voll':return{t:'Studio ist sehr voll',p:['Die Reihenfolge ist egal, Hauptsache am Ende sind alle Muskeln dran. Nimm, was frei ist, und schieb Besetztes ans Ende.','Kabelzug und Kurzhanteln sind fast immer frei, für fast jede Übung gibt es dort eine Alternative. An richtig vollen Tagen reicht die Kurzfassung: vier Übungen, je zwei Sätze, etwa 30 Minuten.'],
    a:inS?[cBtn('Ans Ende schieben','data-do="later"',true),cBtn(ic('swap',18)+'Alternativen zeigen','data-do="swap"')]:[cBtn(ic('bolt',18)+'Kurzfassung starten',`data-do="start" data-t="${nt}" data-short="1"`,true)]};
  case 'technik':return inS?{t:'Wie geht die Übung?',p:['Drei Punkte zur Ausführung, die typischen Fehler und ein Video.'],a:[cBtn(ic('book',18)+(E.alt||ex.n)+' erklären',`data-do="tech" data-n="${esc(E.alt||ex.n)}" data-m="${ex.m}"`,true)]}
    :{t:'Wie geht die Übung?',p:['Tipp eine Übung an.'],a:PLAN[nt].ex.map(id=>cBtn(esc(EX[id].n),`data-do="tech" data-n="${esc(EX[id].n)}" data-m="${EX[id].m}"`))};
  case 'schwer':return{t:'Gewicht ist zu schwer',p:[ex?`Schaffst du ${ex.r[0]} saubere ${unitW(ex)} nicht, nimm eine Stufe weniger. Saubere Wiederholungen bringen mehr als Gewicht auf der Stange.`:'Schaffst du die untere Grenze nicht sauber, nimm eine Stufe weniger. Saubere Wiederholungen bringen mehr als Gewicht.','Ziel ist, ein bis zwei Wiederholungen vor dem Versagen aufzuhören. Die App merkt sich das und schlägt nächstes Mal passend vor.'],
    a:inS?[cBtn(ic('minus',18)+'Eine Stufe leichter',`data-do="w" data-i="${ai}" data-v="-1"`,true)]:[]};
  case 'leicht':return{t:'Gewicht ist zu leicht',p:['Hast du nach dem Satz noch drei oder mehr Wiederholungen übrig, nimm im nächsten Satz eine Stufe mehr.',ex?`Schaffst du in allen Sätzen ${ex.r[1]}, schlägt die App beim nächsten Mal von selbst mehr Gewicht vor.`:'Schaffst du in allen Sätzen die obere Grenze, schlägt die App beim nächsten Mal mehr Gewicht vor.'],
    a:inS?[cBtn(ic('plus',18)+'Eine Stufe schwerer',`data-do="w" data-i="${ai}" data-v="1"`,true)]:[]};

}

/* ============ Startseite: Cockpit ============ */
const hmAt=ms=>{try{const p=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Europe/Berlin'}).formatToParts(new Date(ms));const g=t=>((p.find(x=>x.type===t)||{}).value||'00').padStart(2,'0');return g('hour')+':'+g('minute')}catch(e){const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};
const hourNow=()=>{try{const p=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hourCycle:'h23',timeZone:'Europe/Berlin'}).formatToParts(new Date()).find(x=>x.type==='hour');const h=p?parseInt(p.value,10):NaN;return isNaN(h)?new Date().getHours():h%24}catch(e){return new Date().getHours()}};
const kraftWoche=()=>SESS.filter(x=>x.d>=monday(TODAY)&&x.d<=TODAY).length;
/** Lage des Tages: was erledigt ist und was noch offen ist */
function lage(){
  const w=wAt(TODAY),weighed=!!(w&&w.v!=null),done=SESS.filter(x=>x.d===TODAY).pop(),kw=kraftWoche();
  const fplan=curPlan(),ft=fplan?foodTotals(fplan):null,meals=fplan?fplan.meals.length:0;
  const wp=WP(monday(TODAY)),trainDue=!done&&kw<2&&(wp&&wp.length?wp.includes(TODAY):dO(TODAY).getUTCDay()!==0);
  return{w,weighed,done,kw,trainDue,wp,ready:readiness(S.day.check),deload:deloadInfo(),fplan,ft,meals,foodDone:!!(fplan&&ft.n>=meals),t:trackNow()};
}
/** Welches Instrument groß steht: folgt der Tageszeit, Erledigtes rückt nach hinten */
function focusNow(L){
  if(FOCUS&&FOCUS.d===TODAY)return FOCUS.f;
  const h=hourNow(),ord=h<11?['ziel','training','essen']:h<19?['training','essen','ziel']:['essen','ziel','training'];
  const open={ziel:true,training:L.trainDue,essen:!!L.fplan&&!L.foodDone};
  return ord.find(k=>open[k])||ord[0];
}
/** Der Satz vom Coach: Lage plus das, was heute noch zählt */
function coachSay(L){
  const t=L.t,parts=[];
  const nx=Coach.nextFeier(EVENTS,TODAY);
  if(t&&t.delta!=null)parts.push(Math.abs(t.delta)<0.25?'Du bist genau im Plan.':t.delta<0?`Du liegst ${nf(-t.delta)} kg vor dem Plan.`:`Du liegst ${nf(t.delta)} kg hinter dem Plan, kein Grund zur Eile.`);
  const todo=[];if(!L.weighed&&hourNow()<12)todo.push('auf die Waage');if(L.trainDue)todo.push(L.ready&&L.ready.level==='schwach'?'ein leichtes Training':L.deload.active?'Training in Entlastung':'Training');if(L.fplan&&!L.foodDone&&hourNow()>=17)todo.push('Essen eintragen');
  if(nx&&nx.in===0)parts.push(`Heute ist ${nx.t}, tagsüber leicht und eiweißreich.`);
  else if(todo.length)parts.push('Heute noch: '+todo.join(', ').replace(/, ([^,]*)$/,' und $1')+'.');
  else if(L.fplan&&!L.foodDone)parts.push(L.done?`Training erledigt, stark. Essen bisher ${L.ft.n} von ${L.meals} Mahlzeiten.`:`Essen bisher ${L.ft.n} von ${L.meals} Mahlzeiten.`);
  else parts.push(L.done?'Training erledigt, stark.':'Für heute ist alles erledigt.');
  return parts.join(' ');
}
function ringSVG(p,size,label,sw){sw=sw||7;const r=size/2-sw/2-1,c=2*Math.PI*r,q=Math.max(0,Math.min(1,p));return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>${q>0.005?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(q*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''}</svg>`}
/** Bogen-Instrument: vom Start der Phase zum Ziel. Füllung = Wochentief, weißer Ring = Plan heute, Striche = Etappen. */
function gaugeSVG(t){
  const s0=t.path.pts[0][1],z=t.path.kg,W=320,H=186,cx=160,cy=158,r=134,f=v=>Math.max(0,Math.min(1,(s0-v)/((s0-z)||1))),P=q=>[cx-r*Math.cos(Math.PI*q),cy-r*Math.sin(Math.PI*q)];
  const arc=(a,b)=>{const[x0,y0]=P(a),[x1,y1]=P(b);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
  const ticks=t.path.pts.slice(1,-1).map(([,kg])=>{const q=f(kg),[x,y]=P(q),[x2,y2]=[cx-(r-18)*Math.cos(Math.PI*q),cy-(r-18)*Math.sin(Math.PI*q)];return `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round"/>`}).join('');
  const low=t.low?t.low.kg:s0,[px,py]=P(f(t.plan)),[lx,ly]=P(f(low));
  return `<svg class="gauge-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weg vom Start ${nf(s0)} kg zum Ziel ${nf(z)} kg. Wochentief ${nf(low)} kg, Plan heute ${nf(t.plan)} kg.">
    <path d="${arc(0,1)}" fill="none" stroke="var(--surface-2)" stroke-width="14" stroke-linecap="round"/>
    ${f(low)>0.005?`<path d="${arc(0,f(low))}" fill="none" stroke="var(--route)" stroke-width="14" stroke-linecap="round"/>`:''}
    ${ticks}<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="var(--route)" stroke="var(--surface)" stroke-width="3"/>
    <text x="26" y="${H-3}" text-anchor="middle" fill="var(--ink-3)" font-size="12" font-family="Instrument Sans,system-ui">${nf(s0)}</text><text x="${W-4}" y="${H-3}" text-anchor="end" fill="var(--ink-3)" font-size="12" font-family="Instrument Sans,system-ui">Ziel ${nf(z)}</text></svg>`}
function nextMile(t){const n=t.path.pts.slice(1).find(([d])=>d>TODAY);if(!n)return null;const ok=t.low&&t.low.kg<=n[1]+0.05;return{d:n[0],kg:n[1],ok,rest:t.low?Math.max(0,t.low.kg-n[1]):null}}
const vt=n=>` style="view-transition-name:vt-${n}"`;

    <p class="say">Wochentief <b>${t.low?nf(t.low.kg):'?'} kg</b>, Plan heute <b>${nf(t.plan)} kg</b>.${m?(m.ok?` Etappe ${nf(m.kg)} kg schon geschafft.`:` Nächste Etappe ${nf(m.kg)} kg${m.rest!=null?', noch '+nf(m.rest)+' kg':''}.`):''}</p></article>`}

/* ============ Session ============ */
/** Kurzfassung: je eine Übung für Brust, Rücken, Beine und Schultern, je 2 Sätze. Etwa 30 Minuten. */
function shortList(t){const out=[];for(const m of ['Brust','Rücken','Beine','Schultern']){const id=PLAN[t].ex.find(i=>EX[i].m===m&&!out.includes(i));if(id)out.push(id)}return out.length>=3?out:PLAN[t].ex.slice(0,4)}
/** Für die spätere Auswertung: Reihenfolge der Sätze, echte Pausen und ob eine Übung allein oder im Wechsel lief. */
/** Vorschlag für den Beginn: Uhrzeit aus dem Kalender, sonst jetzt minus Dauer auf die Viertelstunde. */
function actStart(k,d,min){const ev=k==='F'?Coach.eventsOn(EVENTS,d,'fussball')[0]:null;if(ev&&ev.h&&/^\d{1,2}:\d{2}/.test(ev.h))return ev.h.slice(0,5).padStart(5,'0');
  const q=15*60000;return hmAt(Math.floor((Date.now()-min*60000)/q)*q)}
function zeitAblauf(sets){
  const ch=sets.filter(x=>x.t).sort((a,b)=>a.t-b.t);
  ch.forEach((x,n)=>{x.ord=n+1;const pr=ch[n-1];x.pause=pr?Math.round((x.t-pr.t)/1000):null;x.geplant=pr&&pr._p!=null?pr._p:null;
    const pe=ch.slice(0,n).reverse().find(y=>y._e===x._e);x.pauseEx=pe?Math.round((x.t-pe.t)/1000):null});
  const ab={};new Set(ch.map(x=>x._e)).forEach(e=>{const m=ch.filter(x=>x._e===e),a=m[0].ord,b=m[m.length-1].ord;
    const o=[...new Set(ch.filter(x=>x.ord>a&&x.ord<b&&x._e!==e).map(x=>x.name))];ab[e]=o.length?'im Wechsel mit '+o.join(', '):'isoliert'});
  sets.forEach(x=>{x.ablauf=ab[x._e]||'';delete x._p;delete x._e});
  return sets;
}
function startSession(t,short,mode){
  const plan=PLAN[t];const list=short?shortList(t):plan.ex;
  // mode: 'light' = ein Satz weniger, 10 % leichter; 'deload' = halbe Sätze, gleiche Gewichte, keine Steigerung
  S.session={id:'s-'+TODAY+'-'+t+'-'+Date.now().toString(36).slice(-5),type:t,short:!!short,mode:mode||'',start:Date.now(),cur:0,rest:null,ex:list.map(id=>{const ex=EX[id],h=H[id]||[],L=h[h.length-1],hn=hintFor(id);
    let w=hn.w!=null?hn.w:(L?L.w:0);if(mode==='deload'&&L)w=L.w;if(mode==='light'){const st=Math.max(0.5,ex.inc||0.5);w=Math.floor(w*0.9/st)*st}
    const n=short?Math.min(2,ex.s):mode==='deload'?Math.max(1,Math.ceil(ex.s/2)):mode==='light'?Math.max(1,ex.s-1):ex.s;
    return{id,alt:null,aid:null,note:'',showNote:false,act:null,sets:Array.from({length:n},(_,i)=>{const g=L?(L.reps[i]!=null?L.reps[i]:L.reps[L.reps.length-1]):null;return{w,r:hn.up&&!mode?ex.r[0]:(g!=null?g:ex.r[0]),g,rir:null,done:false}})}})};
  if(S.day.type!=='t'&&!S.day.fixed){S.day.type='t';saveDay()}
  persistSession();
}
const curEx=()=>S.session.ex[S.session.cur];
function exHint(E){
  if(!E.alt)return hintFor(E.id);
  const ex=exOf(E),h=HA[E.alt]||[],L=h[h.length-1];
  if(E.aid&&ex.knee&&!L)return{tone:'accent',title:'Knie-Übung, erstes Mal',text:ex.u==='s'?`Fang mit der leichten Variante an, das Knie liegt auf der Bank statt der Fuß. ${ex.r[0]} bis ${ex.r[1]} Sekunden je Seite, steigern erst, wenn nichts zieht.`:`Steig mit 60 bis 70 Prozent ein, saubere ${ex.r[0]} bis ${ex.r[1]} ${unitW(ex)}. Steigern erst, wenn das Knie ruhig bleibt.`};
  if(L)return{tone:'neutral',title:'Wie letztes Mal',text:`Am ${dm(L.d)} ${L.w?kg(L.w)+' kg × ':''}${L.reps.join(' · ')} ${unitW(ex)}. ${ex.u==='s'?'Fünf Sekunden länger':'Eine Wdh. mehr'} reicht schon.`};
  return{tone:'neutral',title:'Neue Variante',text:isBW(E)?`Erste Einheit ohne Gewicht. Saubere ${ex.r[0]} bis ${ex.r[1]} Wdh., langsam ablassen. Werden es mehr, kannst du später auf die Variante mit Gewicht wechseln.`:'Erste Einheit mit dieser Übung. Wähle ein Gewicht für 8 saubere Wdh. Der Verlauf startet ab heute neu.'};
}
const exLast=E=>{const h=E.alt?HA[E.alt]:H[E.id];return h&&h.length?h[h.length-1]:null};

function setRow(ex,s,i,active,bw){

  if(!active)return `<div class="set ${s.done?'done':'pend'}">

        <span class="set-n">Satz ${i+1}</span><span class="set-v">${bw?'':kg(s.w)+' <small>kg</small> × '}${s.r}${ex.u==='s'?' <small>s</small>':bw?' <small>Wdh.</small>':''}${s.done&&s.rir!=null?` <small>· ${s.rir===3?'3+':s.rir} im Tank</small>`:''}</span>${dl||'<span></span>'}<span class="chk">${ic('check',16,3)}</span></button>
      ${s.done&&s.rir==null?`<div class="rir"><p>Wie viele Wdh. wären noch gegangen?</p><div class="rir-c">${[0,1,2,3].map(v=>`<button data-act="rir" data-i="${i}" data-v="${v}">${v===3?'3+':v}<small>${['Versagen','knapp','solide','locker'][v]}</small></button>`).join('')}</div></div>`:''}
    </div>`;
  const lo=ex.r[0],hi=ex.r[1],st=ex.u==='s'?5:1,n=Math.floor((hi-lo)/st)+1,U=unitL(ex);

    <div class="set-body">
      <div class="ctrl">
        ${bw?`<div class="step bw"><div class="sv"><b>${ic('check',18,2.5)}</b><small>ohne Gewicht</small></div></div>`:`<div class="step"><button data-act="w" data-i="${i}" data-v="-1" aria-label="Gewicht verringern">${ic('minus',20,2.5)}</button><div class="sv"><b>${kg(s.w)}</b><small>kg</small></div><button data-act="w" data-i="${i}" data-v="1" aria-label="Gewicht erhöhen">${ic('plus',20,2.5)}</button></div>`}
        <div class="step"><button data-act="r" data-i="${i}" data-v="-1" aria-label="Weniger ${U}">${ic('minus',20,2.5)}</button><div class="sv"><b>${s.r}</b><small>${U}</small></div><button data-act="r" data-i="${i}" data-v="1" aria-label="Mehr ${U}">${ic('plus',20,2.5)}</button></div>

      </div>

        <div class="gauge-h"><span>Zielbereich ${lo} bis ${hi}</span><b style="color:${s.r>hi?'var(--good)':s.r<lo?'var(--warn)':'var(--ink-2)'}">${s.r>hi?'Über dem Bereich: nächstes Mal mehr Gewicht':s.r<lo?'Unter dem Bereich':s.r===hi?'Oberes Ende erreicht':`${hi-s.r} bis zum oberen Ende`}</b></div>
        <div class="gauge-t" style="grid-template-columns:repeat(${n},1fr)">${Array.from({length:n},(_,k)=>`<i class="${lo+k*st<=s.r?'on':''} ${s.g===lo+k*st?'gh':''}"></i>`).join('')}</div>
        <div class="gauge-n" style="grid-template-columns:repeat(${n},1fr)">${Array.from({length:n},(_,k)=>`<span>${lo+k*st}</span>`).join('')}</div>

function restBar(){const r=S.session.rest;return `<div class="rest" id="rest" role="timer" aria-live="off"><div class="rest-prog"><i id="restBar"></i></div>

function nextLabel(){const se=S.session,E=curEx();const i=E.sets.findIndex(s=>!s.done);
  if(i>=0)return `Satz ${i+1} · ${kg(E.sets[i].w)} kg × ${E.sets[i].r}`;const n=se.ex[se.cur+1];if(!n)return 'Einheit abschließen';return `${n.alt||EX[n.id].n} · ${kg(n.sets[0].w)} kg`}
function summary(){
  const se=S.session;const out=[];let sets=0,vol=0;
  for(const E of se.ex){const d=E.sets.filter(s=>s.done);if(!d.length)continue;sets+=d.length;vol+=sum(d.map(s=>s.w*s.r));
    const best=Math.max(...d.map(s=>e1(s.w,[s.r])));const h=E.alt?(HA[E.alt]||[]):(H[E.id]||[]);const last=exLast(E);const all=h.length?Math.max(...h.map(x=>e1(x.w,x.reps))):0;
    out.push({name:E.alt||EX[E.id].n,d,pr:exOf(E).u!=='s'&&h.length>0&&best>all+0.01,dr:last?sum(d.map(s=>s.r))-sum(last.reps.slice(0,d.length)):null,w:d[0].w})}
  return{out,sets,vol,total:sum(se.ex.map(E=>E.sets.length)),min:Math.max(1,Math.round((Date.now()-se.start)/60000))};
}

function render(){
  if(!S.state)return;
  keepAwake(!!(S.session&&S.inSession));
  const sc=appEl.querySelector('.scroll');const top=sc?sc.scrollTop:0;
  const inSession=S.session&&S.inSession;

  if(S.tab==='fortschritt')S.tab='woche';
  const views={heute:vHeute,gewicht:vGewicht,training:vTraining,woche:vWoche,essen:vEssen};
  appEl.dataset.dom=inSession||S.tab==='training'?'drive':S.tab==='essen'?'fuel':'route';
  appEl.innerHTML=(inSession?vSession():`<div class="scroll">${views[S.tab]()}</div>${tabbar()}`)+vSheet()+(S.toast?`<div class="toast ${S.toast.err?'err':''}" role="status">${ic(S.toast.err?'warn':'check',20,2.5)}<span>${esc(S.toast.msg)}</span></div>`:'');
  const sc2=appEl.querySelector('.scroll');if(sc2&&key===lastKey)sc2.scrollTop=top;lastKey=key;
  if(inSession){const p=appEl.querySelector('.expill.cur');if(p)p.scrollIntoView({block:'nearest',inline:'center'})}
  mountCharts();tick();updateSyncChip();
}
